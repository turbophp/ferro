# .github/workflows/ci.yml
name: ci
on:
  push: { branches: [main, m0-build, m1-build] }
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      # `--all-targets` is load-bearing, not cosmetic: without it clippy never lints tests,
      # benches or examples — which is where the live acceptance gates live.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace          # offline: live suites skip (no FERRO_TEST_{PG,MYSQL,MARIADB}_URL)
      # Stable-toolchain type-check for the ferrod fuzz target's standalone workspace (see
      # fuzz-smoke's NOTE below for why its actual `cargo fuzz run` is nightly-only/deferred):
      # `cargo check` alone doesn't need coverage instrumentation, so it compiles cleanly on
      # stable and catches API drift between session_classify.rs and ferrod without waiting on
      # the nightly ICE fix.
      - run: cd engine/crates/ferrod/fuzz && cargo check
      # The M0 EXIT GATE (SPEC §16.1 / D12): a bench run must stay committed under bench/results/.
      # The script existed since M0 but was wired into no workflow, so deleting the recorded
      # measurement would have been green. It needs no toolchain or backend — it is a file check.
      - run: ./ci/check-d12-recorded.sh

  # The LIVE acceptance lane. It must be able to FAIL: every live suite in this repo is
  # `skip`-if-unconfigured by design, so a DSN this lane forgets to export turns its whole tier
  # into a silent no-op that reports "N passed" with zero database contact. Through M1-S6 this lane
  # started `pg` only, which meant the MySQL/MariaDB tier — its §19.3 chaos matrix, its pin/hygiene
  # hard gate and the S7 type suite — had never actually run in CI. All three engines now run.
  #
  # It brings the backends up with `testkit/docker-compose.yml` itself rather than a `services:`
  # block, because a `services:` container CANNOT do two things the MySQL tier depends on:
  #   1. override the image `command:` — the OK-packet session trackers
  #      (`session_track_state_change` / `_transaction_info` / a CURATED `_system_variables` list)
  #      are server-START flags, and they are the MySQL pin engine's AUTHORITY (the S1 RFQ analog);
  #   2. mount `/docker-entrypoint-initdb.d` — services start BEFORE checkout, so `mysql-init.sql`
  #      (the `ferro_smoke` seed and the §7.1 `p_set_session()` in-stored-program fixture) could
  #      never be applied.
  # Using the compose file also keeps the images DIGEST-PINNED and the credentials/healthchecks
  # identical to local dev by construction, instead of by hand-copy that can drift.
  integration:
    runs-on: ubuntu-latest
    env:
      FERRO_TEST_PG_URL: postgres://ferro:ferro@127.0.0.1:55432/ferro
      FERRO_TEST_MYSQL_URL: mysql://ferro:ferro@127.0.0.1:33060/ferro
      FERRO_TEST_MARIADB_URL: mysql://ferro:ferro@127.0.0.1:33061/ferro
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `--wait` blocks on each service's compose healthcheck, so the suite never races a backend
      # that is listening but still running its init script.
      - run: docker compose -f testkit/docker-compose.yml up -d --wait pg mysql mariadb
      - name: live suite (all three engines)
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee live.log
      # Belt-and-braces against this lane rotting back into a no-op: EVERY live suite here prints
      # `skip: FERRO_TEST_*_URL unset` and returns green when its DSN is missing, which is exactly
      # how the MySQL/MariaDB tier stayed "23 passed" with zero database contact. In THIS lane a
      # skip is a lane FAILURE, not a pass. The detector is a SHARED script (case-insensitive,
      # word-anchored) so `ci/local-gate.sh` cannot drift into a weaker check — see its header for
      # why the old inline `grep -n 'skip:'` missed nine uppercase `SKIP name:` lines.
      - name: a skipped live suite fails the lane
        run: ./ci/assert-no-skips.sh live.log
      - if: always()
        run: docker compose -f testkit/docker-compose.yml logs --no-color --tail=80

  # The PHP tier, OFFLINE + LIVE. Through M1-S7 this job had no database, no FERRO_TEST_PG_URL and
  # no `ferrod` binary, so every `php/client/tests/Live/*` self-skipped and PHPUnit still exited 0
  # — the same silent-no-op class the `integration` lane closed, one tier over. `Live/TypesLiveTest`
  # (the client half of the S7 canonical-type acceptance: 8 tests, 57 assertions against real PG)
  # contributed ZERO assertions in CI. It now gets the compose PG, a built `ferrod`, and a
  # live-only re-run under `--fail-on-skipped` so a skipped live tier FAILS the lane.
  php:
    runs-on: ubuntu-latest
    env:
      FERRO_TEST_PG_URL: postgres://ferro:ferro@127.0.0.1:55432/ferro
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: msgpack, tools: composer }
      - uses: dtolnay/rust-toolchain@stable
      - run: docker compose -f testkit/docker-compose.yml up -d --wait pg
      # PHP cannot host the daemon in-process, so LiveTestCase spawns a REAL ferrod per test and
      # locates it at `target/debug/ferrod` (or `$FERRO_FERROD_BIN`). No binary => every live test
      # skips, which is precisely the hole this step closes.
      - run: cargo build -p ferrod
      - run: (cd php/client && composer install --no-interaction)
      - run: (cd php/client && ./vendor/bin/phpunit)
      # The live tier again, ALONE, with skips fatal. It cannot be `--fail-on-skipped` on the whole
      # suite: the conformance tier skips legitimately (decode-only vectors, ext-msgpack lossy
      # uint64). Scoped to `tests/Live` by PATH (not a phpunit.xml testsuite, which PHPUnit 11 warns
      # about when a file belongs to two suites), the ONLY two skip reasons are the missing
      # prerequisites this job now provides — so a skip here means the lane stopped testing.
      - run: (cd php/client && ./vendor/bin/phpunit tests/Live --fail-on-skipped)
      - run: (cd php/client && ./vendor/bin/phpstan analyse src --level 9)
      - if: always()
        run: docker compose -f testkit/docker-compose.yml logs --no-color --tail=80 pg

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The FULL `cargo deny check` — advisories + bans + licenses + sources. `check bans` alone
      # enforced only the D9 "no deadpool/bb8" rule and silently ignored the `[advisories]` and
      # `[licenses]` sections deny.toml actually configures.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cd engine/crates/ferro-proto && cargo +nightly fuzz run decode_frame -- -runs=20000 -max_total_time=60
      - run: cd engine/crates/ferro-proto && cargo +nightly fuzz run roundtrip_frame -- -runs=20000 -max_total_time=60
      # NOTE: engine/crates/ferrod/fuzz/session_classify exists but is NOT run here yet: cargo-fuzz
      # compiles tokio (a ferrod dep) under coverage instrumentation, which ICEs on current nightly
      # rustc. Fix = extract the tokio-free `classify`/codec types into their own crate the fuzz
      # target can depend on without tokio (tracked in S3 report / progress ledger). classify's
      # no-panic property is covered by ferrod unit tests meanwhile.
