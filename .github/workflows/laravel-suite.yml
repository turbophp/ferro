# The M2 / C2 measurement lane: run the CURATED laravel/framework database subset
# (testkit/laravel-suite.sh) against PostgreSQL, TWICE (the two-run reproducibility rule — the
# result line AND the ordered failure set must not differ between runs), and upload both logs.
#
# TWO COLUMNS, because the recorded number depends on which Illuminate `driver` NAME the application
# registers Ferro under, and both names are real product configurations:
#   ferro-pgsql — §15's one-word config change. The default.
#   pgsql       — the same engine under the stock name, via `FerroConnections::register()`'s opt-in
#                 alias. Nine of upstream's own cases gate their assertions or their skip on
#                 `$this->driver` being `pgsql`, so the alias column is higher for a reason that is
#                 about the harness, not about the engine. Recording one column alone would hide
#                 that either way.
#   stock-pgsql — THE CONTROL: upstream's own pdo_pgsql against the same server, no Ferro anywhere.
#                 It is what makes a non-pass triageable — "is this ours, or this framework/server
#                 pair's?" — instead of guessed at, and it earned its place before it was built (two
#                 SchemaBuilderSchemaNameTest cases looked like a Ferro schema gap and reproduce
#                 identically through stock PDO). Its contact assertion INVERTS: it refuses to run
#                 if the connection turns out to be a Ferro one.
#
# ON DEMAND ONLY (workflow_dispatch), for the same reason as the dbal-suite lane: the bar is "green
# modulo a recorded, triaged allow-list", so a red phpunit exit here is DATA to record, not a build
# failure. Putting it on every push would either gate merges on a bar M2 has not reached or train
# everyone to ignore a red check. The job FAILS only when a run died before producing a phpunit
# result line — the contact assertion, the base-class patch check, or a ferrod that never came up.
# That is the silent-no-op class the runner exists to refuse.
#
# PostgreSQL (job `measure`) and the MySQL family (job `measure-mysql`, M2-C1f: MySQL 8.4 and
# MariaDB 11.8, under `ferro-mysql` and `ferro-mariadb` respectively) run here. SQLite needs no server and is measured in the
# dev container (docs/laravel-suite/2026-09-15-c3-6b-sqlite-results.md). Report which columns ran
# and which could not — never restate the bar as if met.
name: laravel-suite
on:
  workflow_dispatch:
    inputs:
      family:
        description: which family's columns to measure
        type: choice
        options: [all, pg, mysql]
        default: all

jobs:
  measure:
    if: inputs.family == 'all' || inputs.family == 'pg'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: msgpack, tools: composer }
      - uses: dtolnay/rust-toolchain@stable
      # The testkit host port 55432 sits inside Linux's ephemeral range (32768–60999), so a
      # transient outbound socket can be holding it when docker-proxy tries to bind — MEASURED on
      # the sibling lane, whose first real dispatch died exactly there. Reserving the port stops the
      # kernel handing it out; the retry covers a connection that grabbed it before the reservation.
      - run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55432
      - run: |
          docker compose -f testkit/docker-compose.yml up -d --wait pg \
            || { sleep 15; docker compose -f testkit/docker-compose.yml up -d --wait pg; }
      - name: measure every driver-name column, twice each
        run: |
          set -o pipefail +e
          for drv in ferro-pgsql pgsql stock-pgsql; do
            for run in 1 2; do
              FERRO_LARAVEL_DRIVER="$drv" FERRO_LARAVEL_SVC=pg \
                FERRO_LARAVEL_DSN="postgres://ferro:ferro@127.0.0.1:55432/laravel_tests?options=-csearch_path%3Dpublic,my_schema" \
                bash testkit/laravel-suite.sh 2>&1 | tee "$drv-run$run.log"
              echo "phpunit exit: $?"
            done
          done
      # Upstream's PostgreSQL-SPECIFIC directory, as its OWN column. It has no `ferro-pgsql` row by
      # construction — its base class carries #[RequiresDatabase('pgsql')], so the whole directory
      # skips under any other driver name — which is exactly why it is not folded into the list
      # above, whose two Ferro columns exist to be comparable.
      - name: measure the PostgreSQL-specific column, twice each
        run: |
          set -o pipefail +e
          for drv in pgsql stock-pgsql; do
            for run in 1 2; do
              FERRO_LARAVEL_ALLOWLIST="$PWD/testkit/laravel/allowlist-postgres.txt" \
                FERRO_LARAVEL_DRIVER="$drv" FERRO_LARAVEL_SVC=pg \
                FERRO_LARAVEL_DSN="postgres://ferro:ferro@127.0.0.1:55432/laravel_tests?options=-csearch_path%3Dpublic,my_schema" \
                bash testkit/laravel-suite.sh 2>&1 | tee "pg-specific-$drv-run$run.log"
              echo "phpunit exit: $?"
            done
          done
      # The lane's OWN pass/fail: a run that never produced a result line did not measure anything.
      # A red phpunit exit is data; a missing result line is a broken lane.
      - name: assert every run actually measured
        run: |
          for f in ferro-pgsql-run1.log ferro-pgsql-run2.log pgsql-run1.log pgsql-run2.log \
                   stock-pgsql-run1.log stock-pgsql-run2.log \
                   pg-specific-pgsql-run1.log pg-specific-pgsql-run2.log \
                   pg-specific-stock-pgsql-run1.log pg-specific-stock-pgsql-run2.log; do
            grep -qE '^(OK|FAILURES!|ERRORS!|Tests: )' "$f" \
              || { echo "::error:: $f has no phpunit result line — the run died before measuring"; tail -40 "$f"; exit 1; }
            grep -q '\[ferro\] connection=' "$f" \
              || { echo "::error:: $f is missing the contact assertion line — it may not have reached Ferro"; exit 1; }
            grep -q '\[ferro\] reset: ' "$f" \
              || { echo "::error:: $f has no reset line — a number from an un-reset database is not reproducible"; exit 1; }
          done
          # And the column really ran under the name it claims: the contact assertion echoes the
          # driver it resolved through, so a broken FERRO_LARAVEL_DRIVER cannot silently produce two
          # copies of the same column.
          grep -q '\[ferro\] connection=.* driver=ferro-pgsql ' ferro-pgsql-run1.log \
            || { echo "::error:: the ferro-pgsql column did not run under that driver name"; exit 1; }
          grep -q '\[ferro\] connection=.* driver=pgsql ' pgsql-run1.log \
            || { echo "::error:: the pgsql column did not run under that driver name"; exit 1; }
          # The CONTROL must have reached the STOCK connection class. This is the inverse assertion,
          # checked again here in the lane itself: a control that silently ran through Ferro would
          # report Ferro's behaviour as upstream's baseline, which is worse than having no baseline.
          grep -q '\[ferro\] connection=Illuminate.Database.PostgresConnection driver=stock-pgsql ' stock-pgsql-run1.log \
            || { echo "::error:: the control column did not resolve the STOCK PostgresConnection"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laravel-suite-logs
          # `.laravel-suite/` is a HIDDEN path, which upload-artifact@v4 skips by default — so the
          # ferrod.log listed below was silently never uploaded until this line (found at C1f, when
          # the MySQL job's artifact came back without it).
          include-hidden-files: true
          path: |
            ferro-pgsql-run1.log
            ferro-pgsql-run2.log
            pgsql-run1.log
            pgsql-run2.log
            stock-pgsql-run1.log
            stock-pgsql-run2.log
            pg-specific-pgsql-run1.log
            pg-specific-pgsql-run2.log
            pg-specific-stock-pgsql-run1.log
            pg-specific-stock-pgsql-run2.log
            .laravel-suite/ferrod.log
      - if: always()
        run: docker compose -f testkit/docker-compose.yml logs --no-color --tail=80 pg

  # The MySQL family (M2-C1f): the same three columns per server — `ferro-mysql` (§15's one-word
  # change), `mysql` (the opt-in stock-name alias) and `stock-mysql` (THE CONTROL: upstream's own
  # pdo_mysql at UTC, like the engine's pinned sessions) — twice each. The alias column exists for the
  # same reason as on PostgreSQL: upstream tests gate on the driver NAME (`#[RequiresDatabase(['mysql',
  # 'mariadb'])]`, `match ($this->driver)`), so only the alias can show those are name artifacts.
  measure-mysql:
    if: inputs.family == 'all' || inputs.family == 'mysql'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Each server is measured under ITS OWN Laravel family. Laravel 11 resolves MariaDB through a
      # separate `mariadb` driver (MariaDbConnection / MariaDbGrammar / MariaDbBuilder), which is the
      # one a Laravel 11 application on MariaDB runs; measuring MariaDB under `mysql` would record
      # the MySQL grammar against it instead.
      matrix:
        include:
          - { svc: mysql, family: mysql, conn: MySqlConnection, ferro: FerroMySqlConnection }
          - { svc: mariadb, family: mariadb, conn: MariaDbConnection, ferro: FerroMariaDbConnection }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: msgpack, tools: composer }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=33060,33061
      - run: |
          docker compose -f testkit/docker-compose.yml up -d --wait ${{ matrix.svc }} \
            || { sleep 15; docker compose -f testkit/docker-compose.yml up -d --wait ${{ matrix.svc }}; }
      - name: measure every driver-name column, twice each
        run: |
          set -o pipefail +e
          for drv in ferro-${{ matrix.family }} ${{ matrix.family }} stock-${{ matrix.family }}; do
            for run in 1 2; do
              FERRO_LARAVEL_DRIVER="$drv" FERRO_LARAVEL_SVC=${{ matrix.svc }} \
                bash testkit/laravel-suite.sh --log-junit "$drv-run$run.xml" 2>&1 | tee "$drv-run$run.log"
              echo "phpunit exit: $?"
            done
          done
      # Upstream's FAMILY-SPECIFIC directory (MySql/ or MariaDb/), as its own column — the C2f shape
      # (allowlist-postgres.txt). Its base class carries #[RequiresDatabase('<family>')], so it runs
      # only under the stock NAME: the alias and the control, the pair that attributes a non-pass.
      - name: measure the family-specific column, twice each
        run: |
          set -o pipefail +e
          for drv in ${{ matrix.family }} stock-${{ matrix.family }}; do
            for run in 1 2; do
              FERRO_LARAVEL_ALLOWLIST="$PWD/testkit/laravel/allowlist-${{ matrix.family }}.txt" \
                FERRO_LARAVEL_DRIVER="$drv" FERRO_LARAVEL_SVC=${{ matrix.svc }} \
                bash testkit/laravel-suite.sh --log-junit "spec-$drv-run$run.xml" 2>&1 | tee "spec-$drv-run$run.log"
              echo "phpunit exit: $?"
            done
          done
      - name: assert every run actually measured, under the name it claims
        run: |
          for drv in ${{ matrix.family }} stock-${{ matrix.family }}; do
            for run in 1 2; do
              f="spec-$drv-run$run.log"
              grep -qE '^(OK|FAILURES!|ERRORS!|Tests: )' "$f" \
                || { echo "::error:: $f has no phpunit result line — the run died before measuring"; tail -40 "$f"; exit 1; }
              grep -q "\[ferro\] connection=.* driver=$drv " "$f" \
                || { echo "::error:: $f did not run under driver $drv"; exit 1; }
              grep -q '\[ferro\] reset: ' "$f" \
                || { echo "::error:: $f has no reset line"; exit 1; }
            done
          done
          grep -q "\[ferro\] connection=Illuminate.Database.${{ matrix.conn }} driver=stock-${{ matrix.family }} " "spec-stock-${{ matrix.family }}-run1.log" \
            || { echo "::error:: the family-specific control did not resolve the STOCK ${{ matrix.conn }}"; exit 1; }
          for drv in ferro-${{ matrix.family }} ${{ matrix.family }} stock-${{ matrix.family }}; do
            for run in 1 2; do
              f="$drv-run$run.log"
              grep -qE '^(OK|FAILURES!|ERRORS!|Tests: )' "$f" \
                || { echo "::error:: $f has no phpunit result line — the run died before measuring"; tail -40 "$f"; exit 1; }
              grep -q "\[ferro\] connection=.* driver=$drv " "$f" \
                || { echo "::error:: $f did not run under driver $drv"; exit 1; }
              grep -q '\[ferro\] reset: ' "$f" \
                || { echo "::error:: $f has no reset line"; exit 1; }
            done
          done
          f=${{ matrix.family }}
          grep -q "\[ferro\] connection=Illuminate.Database.${{ matrix.conn }} driver=stock-$f " "stock-$f-run1.log" \
            || { echo "::error:: the control column did not resolve the STOCK ${{ matrix.conn }}"; exit 1; }
          grep -q "\[ferro\] connection=Ferro.Laravel.${{ matrix.ferro }} driver=ferro-$f " "ferro-$f-run1.log" \
            || { echo "::error:: the ferro-$f column did not resolve ${{ matrix.ferro }}"; exit 1; }
      - name: compare each Ferro column with the control, as SETS (SPEC §22.2 (bz))
        if: always()
        run: |
          f=${{ matrix.family }}
          {
            for drv in "ferro-$f" "$f"; do
              echo "== $drv vs stock-$f (run 1)"
              php testkit/dbal/compare-columns.php "$drv-run1.xml" "stock-$f-run1.xml" || true
            done
            echo "== family-specific: $f vs stock-$f (run 1)"
            php testkit/dbal/compare-columns.php "spec-$f-run1.xml" "spec-stock-$f-run1.xml" || true
          } | tee compare.txt
      # A recorded number is two runs that AGREE. Each column's run 2 against its run 1, as sets: the
      # same skips and the same failures. This one FAILS the job — the comparison above only reports,
      # because a Ferro column differing from its control is a finding, not a broken lane, while a
      # column differing from ITSELF means the measurement is not reproducible.
      - name: each column's run 2 equals its run 1
        run: |
          f=${{ matrix.family }}
          rc=0
          for drv in "ferro-$f" "$f" "stock-$f" "spec-$f" "spec-stock-$f"; do
            php testkit/dbal/compare-columns.php "$drv-run2.xml" "$drv-run1.xml" > "repro-$drv.txt" || true
            a=$(grep -E '^skip:' "repro-$drv.txt"); b=$(grep -E '^fail:' "repro-$drv.txt")
            echo "$drv: $a | $b"
            # Equal sets print the same digest on both sides of each line.
            for line in "$a" "$b"; do
              d=$(echo "$line" | grep -oE 'sha256 [0-9a-f]+' | sort -u | wc -l)
              [ "$d" = 1 ] || { echo "::error:: $drv: run 2 differs from run 1 ($line)"; rc=1; }
            done
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laravel-suite-${{ matrix.svc }}-logs
          include-hidden-files: true   # for .laravel-suite/ferrod.log — see the PG job
          path: |
            *-run1.log
            *-run2.log
            *-run1.xml
            *-run2.xml
            compare.txt
            .laravel-suite/ferrod.log
