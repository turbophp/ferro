# The doctrine/dbal measurement lane: run the CURATED subset (testkit/dbal-suite.sh) against a chosen
# backend family as TWO COLUMNS — Ferro and a stock-driver CONTROL — each TWICE (the two-run
# reproducibility rule, §22.2 (z)), then hold the pair to SPEC D18 and upload every log.
#
# THE CONTROL (E9, SPEC D18 / §22.2 (da)). D18 calls a suite column green when it has PARITY with a
# stock-driver control: every test the control passes also passes through Ferro, the skip sets match
# (or each difference is driver-name gated), and every Ferro-only non-pass is triaged. §22.3 recorded
# that the server-family columns had no control in this workflow — only SQLite did — so their triage
# could not be checked against anything. Every family now runs the identical tests against the
# identical database through upstream's own driver (`pdo_pgsql`, `pdo_mysql`, `pdo_sqlite`), with
# NO ferrod started and the contact assertion INVERTED: testkit/dbal/bootstrap.php refuses to run a
# control whose connection turns out to be a Ferro one, and the step below checks the inverted line
# is in every control log.
#
# ON DEMAND ONLY (workflow_dispatch). It is deliberately NOT part of the per-push `ci` workflow. Two
# things fail a job:
#   1. a run that died before producing a phpunit result line (the contact assertion, the TestUtil
#      patch check, a ferrod that never came up) — the silent-no-op class the runner refuses;
#   2. THE D18 GATE: a Ferro-only non-pass that testkit/dbal/triage.txt does not explain, a column
#      whose run 2 differs from its run 1, or a triage entry whose citation no longer resolves.
# A red phpunit exit is still DATA, not a failure: a column with documented incompatibilities ends
# red in phpunit and green here.
#
# The recording protocol (ledger item A5) lives in docs/dev-loop/LEDGER.md: numbers from THIS lane
# on a MERGED main, two runs diffed, result + ordered failure set into docs/dbal-suite/.
name: dbal-suite
on:
  workflow_dispatch:
    inputs:
      family:
        description: "Backend family to measure (each runs its Ferro column AND its stock-driver control)"
        type: choice
        options: [all, pg, mysql, mariadb, sqlite]
        default: all
      dbal:
        # M2-C5b: WHICH upstream suite — and therefore which driverClass and which of the driver
        # package's vendor trees. The runner derives the major from this tag; nothing else selects it.
        description: "Pinned doctrine/dbal tag (the suite AND the code under test)"
        type: choice
        options: ["4.4.4", "3.10.6"]
        default: "4.4.4"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One job per family runs BOTH columns, so the Ferro column and its control share one runner,
        # one container and one environment — the comparison would mean less across two machines.
        # (Until E9 the SQLite control was a separate `sqlite-control` matrix entry; it is folded in.)
        family: ${{ fromJSON(inputs.family == 'all' && '["pg","mysql","mariadb","sqlite"]' || format('["{0}"]', inputs.family)) }}
    env:
      FERRO_DBAL_TAG: ${{ inputs.dbal }}
      FERRO_DBAL_SVC: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@v4
      # pdo_pgsql, pdo_mysql and pdo_sqlite come with setup-php's default extension set; the CONTROL
      # columns are what need them.
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: msgpack, tools: composer }
      - uses: dtolnay/rust-toolchain@stable
      # The testkit host ports (55432/33060/33061) sit inside Linux's ephemeral range
      # (32768–60999), so any transient outbound socket on the runner can be holding one when
      # docker-proxy tries to bind it — MEASURED: run 34351348533's pg job died on
      # "bind host port 0.0.0.0:55432 … address already in use" while both MySQL-family jobs
      # got lucky. Reserving the ports stops the kernel handing them out as ephemeral source
      # ports; the retry covers the residual case of a connection that grabbed one BEFORE the
      # reservation and is still alive at bind time.
      # SQLite has no container and no host port, so neither of the next two steps applies to it.
      - if: ${{ matrix.family != 'sqlite' }}
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=33060,33061,55432
      # The suite resets its database via `docker compose exec`, so the family's container must be
      # the testkit one — same digest-pinned image, credentials and healthcheck as every other lane.
      - if: ${{ matrix.family != 'sqlite' }}
        run: |
          docker compose -f testkit/docker-compose.yml up -d --wait ${{ matrix.family }} \
            || { sleep 15; docker compose -f testkit/docker-compose.yml up -d --wait ${{ matrix.family }}; }
      - name: the Ferro column and its control, twice each
        run: |
          set -o pipefail +e
          # The server families' control needs the DSN to build its stock-driver params; SQLite's
          # columns both take the runner's own file path (an EMPTY FERRO_DBAL_DSN reads as unset).
          case "$FERRO_DBAL_SVC" in
            pg)      dsn="postgres://ferro:ferro@127.0.0.1:55432/doctrine_tests" ;;
            mysql)   dsn="mysql://ferro:ferro@127.0.0.1:33060/doctrine_tests" ;;
            mariadb) dsn="mysql://ferro:ferro@127.0.0.1:33061/doctrine_tests" ;;
            sqlite)  dsn="" ;;
          esac
          for col in ferro control; do
            control=0; [ "$col" = control ] && control=1
            for run in 1 2; do
              FERRO_DBAL_CONTROL="$control" FERRO_DBAL_DSN="$dsn" \
                ./testkit/dbal-suite.sh --log-junit "$col-run$run.xml" 2>&1 | tee "$col-run$run.log"
              echo "$col run $run: phpunit exit $?"
            done
          done
      - name: every run measured, and under the column it claims
        run: |
          rc=0
          for col in ferro control; do
            for run in 1 2; do
              f="$col-run$run.log"
              # A run that produced NO phpunit result line did not measure anything — the pre-flight
              # (contact assertion, TestUtil patch, ferrod startup) died. A result line with failures
              # or errors is the measurement.
              grep -Eq '^(OK |Tests: |ERRORS!|FAILURES!|OK, but)' "$f" \
                || { echo "::error:: $f contains no phpunit result line — the run died before measuring"; tail -40 "$f"; rc=1; }
              grep -q '\[ferro\] reset: ' "$f" \
                || { echo "::error:: $f has no reset line — a number from an un-reset database is not reproducible"; rc=1; }
              [ -s "$col-run$run.xml" ] || { echo "::error:: $col-run$run.xml is missing or empty"; rc=1; }
            done
            # The contact assertion's own line, in its own direction: the Ferro column reached a
            # Ferro driverClass, and the control reached upstream's PDO driver with no daemon started.
            # Each log on its own: `grep -q PATTERN a b` succeeds when EITHER file matches, so one
            # good run would have vouched for a run that never reached Ferro (E9 review).
            if [ "$col" = ferro ]; then
              for run in 1 2; do
                grep -q '^\[ferro\] driver=Ferro\\DBAL\\' "ferro-run$run.log" \
                  || { echo "::error:: Ferro run $run did not report a Ferro driverClass"; rc=1; }
              done
            fi
            # Both columns answer upstream's vendor gates with a PDO driver name (E9 review F5); a run
            # that answered none would skip every positive vendor gate in silence.
            for run in 1 2; do
              grep -Eq '^\[(ferro|control)\] driver=.* vendor_gates=pdo_(pgsql|mysql|sqlite)$' "$col-run$run.log" \
                || { echo "::error:: $col run $run does not answer the vendor gates with a PDO driver name"; rc=1; }
            done
            if [ "$col" = control ]; then
              for run in 1 2; do
                grep -q '^\[control\] no ferrod started' "control-run$run.log" \
                  || { echo "::error:: control run $run does not say it started no ferrod"; rc=1; }
                grep -q '^\[control\] driver=Doctrine\\DBAL\\Driver\\PDO\\' "control-run$run.log" \
                  || { echo "::error:: control run $run did not reach upstream's PDO driver"; rc=1; }
              done
            fi
          done
          exit $rc
      # A recorded number is two runs that AGREE: the same tests with the same outcomes, as sets.
      - name: each column's run 2 equals its run 1
        run: |
          # pipefail: an unspecified `shell:` runs `bash -e` WITHOUT it, so `php … | tee` would
          # report tee's status and the check would pass whatever php said.
          set -o pipefail
          rc=0
          for col in ferro control; do
            echo "== $col"
            php testkit/dbal/compare-columns.php "$col-run2.xml" "$col-run1.xml" --repro | tee "repro-$col.txt" || rc=1
          done
          exit $rc
      # THE D18 GATE. The upstream clone is passed so every `upstream:` citation that applies to this
      # column is checked against the very tree the run measured.
      - name: D18 — the Ferro column against its control, and every Ferro-only non-pass triaged
        if: always()
        run: |
          set -o pipefail   # the gate's exit status, not tee's (see the step above)
          major="${FERRO_DBAL_TAG%%.*}"
          php testkit/dbal/compare-columns.php ferro-run1.xml control-run1.xml \
            --triage testkit/dbal/triage.txt --column "dbal$major-$FERRO_DBAL_SVC" \
            --upstream ".dbal-suite/dbal-$FERRO_DBAL_TAG" | tee d18.txt
      - name: summary
        if: always()
        run: |
          {
            echo "## dbal-suite · doctrine/dbal ${{ inputs.dbal }} · ${{ matrix.family }}"
            echo '```'
            for f in ferro-run1.log ferro-run2.log control-run1.log control-run2.log; do
              echo "$f: $(grep -E '^(Tests: |OK)' "$f" 2>/dev/null | tail -1)"
            done
            grep -E '^D18 VERDICT|^  (pass|skip) parity|^  failure set' d18.txt 2>/dev/null || echo "no D18 verdict"
            echo '```'
            echo "Reset lines (a recorded run must show them):"
            echo '```'
            grep '\[ferro\] reset:' ferro-run*.log control-run*.log || echo "NONE — do not record this run"
            echo '```'
            echo "Contact line (Ferro column) / inverted contact line (the control):"
            echo '```'
            grep -E '^\[(ferro|control)\] driver=' ferro-run*.log control-run*.log || echo "NONE — do not record this run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbal-suite-${{ inputs.dbal }}-${{ matrix.family }}-${{ github.run_id }}
          path: |
            ferro-run1.log
            ferro-run2.log
            control-run1.log
            control-run2.log
            ferro-run1.xml
            ferro-run2.xml
            control-run1.xml
            control-run2.xml
            repro-*.txt
            d18.txt
            .dbal-suite/ferrod.log
          if-no-files-found: warn
          # A hidden path, which upload-artifact@v4 skips by default (found at M2-C1f).
          include-hidden-files: true
