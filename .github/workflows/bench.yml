# SPEC §16 measurements on the D17 reference environment: a GitHub-hosted `ubuntu-latest` runner,
# with the environment manifest recorded per run (§21 D17). Every number is taken TWICE, in two
# separate jobs on two separate runners, because a shared runner is noisy and one run is an anecdote.
#
# A result is DATA to record, not a build verdict: a missed budget does not fail the job. The job
# fails when a run could not produce a valid record (`validate()` refused it, or ferrod or PHP
# died), and when it would have SKIPPED (no Postgres): on a runner a skip is a failure, and the
# upload step refuses an empty result set.
#
# Runs on demand, and on a pull request that changes the bench itself — a new workflow can only be
# dispatched once it is on the default branch, and a bench change should be measured before it lands.
# Each run prints its record whole into the log and uploads it as an artifact; the committed files
# in bench/results/ are copied from there.
name: bench
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Which §16 measurement"
        type: choice
        options: [fanout, trivial, all]
        default: fanout
  pull_request:
    paths:
      - "bench/src/**"
      - "bench/*.php"
      - ".github/workflows/bench.yml"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    env:
      FERRO_TEST_PG_URL: postgres://ferro:ferro@127.0.0.1:55432/ferro
      FERRO_BENCH_ENV: gh-ubuntu-latest
    steps:
      # On a pull request the default checkout is GitHub's synthetic merge commit, which is on no
      # branch; the manifest's git_sha must name the commit that was measured.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # `coverage: none`: setup-php enables Xdebug on GitHub's Ubuntu images by default, and Xdebug
      # disables the JIT the bench requires (the harness refuses a JIT that did not engage).
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", extensions: "opcache, pdo_pgsql", tools: composer, coverage: none }
      - uses: dtolnay/rust-toolchain@stable
      - run: docker compose -f testkit/docker-compose.yml up -d --wait pg
      - run: cargo build -p ferrod --release
      - run: (cd php/client && composer install --no-interaction --no-dev --prefer-dist)
      - name: measure
        run: |
          scenario="${{ inputs.scenario || 'fanout' }}"
          if [ "$scenario" = all ]; then set -- fanout trivial; else set -- "$scenario"; fi
          for s in "$@"; do
            echo "::group::$s (run ${{ matrix.run }})"
            cargo run --release -p ferro-bench -- --baseline pdo --scenario "$s"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-run${{ matrix.run }}
          path: bench/results/*-gh-ubuntu-latest*.json
          if-no-files-found: error
