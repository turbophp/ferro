[package]
name = "ferro-proto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rmp = "0.8"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "gen-registry-lock"
path = "src/bin/gen_registry_lock.rs"

[[bin]]
name = "gen-vectors"
path = "src/bin/gen_vectors.rs"
