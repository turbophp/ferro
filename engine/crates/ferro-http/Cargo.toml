[package]
name = "ferro-http"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# SPEC §23 (Ferro HTTP). Slice M6-F3 built the configuration model and the request validator
# (§23.3.1, §23.4, the §23.8.5 address classification); slice M6-F4a adds the pure fate classifier
# (`fate`, always built) and the HTTP/1.1 plaintext engine (`engine`, behind the `engine` feature).
#
# `unicode-normalization` is D20's one non-network dependency, used ONLY by `PATH_ENCODING=utf8`'s
# NFKC dot check (§23.4.2 step 8). Its licence (MIT OR Apache-2.0, and `tinyvec`'s
# Zlib OR Apache-2.0 OR MIT) is on `deny.toml`'s allow-list — premise P16, which spike F1a measured
# as HOLDS. It was already in the workspace lock (through `stringprep`), so this adds no new crate.
#
# `ferro-proto` (always): the fate classifier names codes, branches and `[http.causes]` tokens ONLY
# through the generated constants (charter rule 2) — F3 deliberately did not spell them.
[dependencies]
unicode-normalization = "0.1.25"
ferro-proto = { path = "../ferro-proto" }
# --- the `engine` feature: SPEC D20's adopted set, as spike F1a measured it (§23.13) -------------
# NORMAL dependencies now (F1a had them as dev-dependencies), but OPTIONAL: the network engine is
# behind this crate's `engine` feature, which `ferrod`'s default-on `http` feature enables. The
# default build of this crate stays tokio-free ON PURPOSE — its three `cargo-fuzz` targets build
# under coverage instrumentation, which tokio ICEs on current nightly (ci.yml's fuzz-smoke NOTE), so
# pulling tokio into the default feature set would silently cost the SSRF rule its fuzz job.
# `http2` waits for F5b. Every crate below was already in the lock (F1a).
hyper = { version = "1", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
bytes = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"], optional = true }
tokio-util = { version = "0.7", optional = true }
tracing = { version = "0.1", optional = true }
# §23.9.2 content decoding (M6-F4b): gzip / zlib / raw deflate through the LOW-LEVEL `Decompress`,
# so each step's output is bounded (`engine::decode`). `flate2` 1.1.9 and its pure-Rust
# `miniz_oxide` backend were already in the lock (through `mysql_async`), and §23.13 records
# "`flate2` is already locked" — so this adds no crate. `default-features = false` plus
# `rust_backend` keeps the C zlib backends out.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
# §23.8.8 TLS (M6-F5a): D20's TLS half, with EXACTLY the selections spike F1a measured (§23.13, P3).
# `tokio-rustls`'s DEFAULT features select `aws_lc_rs` (CMake + the OpenSSL licence: the backend D20
# rejects), so `default-features = false` is load-bearing, not tidiness. All four were already in the
# lock (the F1a spike), so this adds no crate.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pki-types = { version = "1", optional = true }
# TEST-ONLY certificate generation (`testcert`, behind the non-default `test-certs` feature, which only
# `ferrod`'s dev-dependency enables). `rcgen` is not in the lock and D20 does not list it, so the
# suites build their certificates IN-TEST with a small DER writer signed by `ring` — the crypto
# backend D20 already adopts (in the lock through `rustls`). Never linked into a daemon build.
ring = { version = "0.17", optional = true }

[features]
default = []
engine = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http",
    "dep:http-body",
    "dep:bytes",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:flate2",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pki-types",
]
# Test scaffolding only (see `ring` above): `ferro_http::testcert`.
test-certs = ["dep:ring", "dep:rustls-pki-types"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
ring = "0.17"
