[package]
name = "ferro-pool"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ferro-proto = { path = "../ferro-proto" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
fastrand = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util", "time"] }
