[package]
name = "ferro-http-spike"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# M6-F1a: the HTTP premise spike. Ships NO library code (src/lib.rs is docs only); every premise is a
# test under tests/. The first group of dev-dependencies is EXACTLY SPEC D20's adopted set (§23.13),
# with the feature selections §23.13 names, so `cargo deny check` over this crate is premise P3's
# gate. Extras needed only by the tests are grouped and commented after it.
[dependencies]

[dev-dependencies]
# --- SPEC D20, §23.13 ---------------------------------------------------------------------------
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http = "1"
http-body = "1"
# tokio-rustls's DEFAULT features select aws-lc-rs (the backend D20 rejects: CMake + the OpenSSL
# licence), so `default-features = false` is load-bearing here, not tidiness (P3).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
unicode-normalization = "0.1"
# --- test scaffolding only ----------------------------------------------------------------------
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
futures = "0.3"
# P15's HTTP/2 half needs a server; h2 is already in the tree through hyper's `http2` feature.
h2 = "0.4"
# P17 is measured against ferrod's REAL `serve` + `Session` (§23.19: "measured against
# serve.rs/session"), so the spike links the daemon's library.
ferrod = { path = "../ferrod" }
ferro-proto = { path = "../ferro-proto" }
tokio-util = { version = "0.7", features = ["codec"] }
