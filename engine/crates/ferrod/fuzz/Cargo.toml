[package]
name = "ferrod-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"

[dependencies.ferrod]
path = ".."

[[bin]]
name = "session_classify"
path = "fuzz_targets/session_classify.rs"
test = false
doc = false
bench = false

[workspace]

# This empty [workspace] table makes the fuzz dir its own workspace ROOT (the standard cargo-fuzz
# layout), so the repo root's [patch.crates-io] does NOT reach it — patches only apply from the
# workspace root that resolves the graph. Without mirroring them here, this workspace resolves
# STOCK tokio-postgres/mysql_async from crates.io and `cargo check` fails on the fork-only
# accessors (`transaction_status`, `clear_typeinfo_statement_cache`). Keep in lockstep with the
# root Cargo.toml's patch section; drop each line when its upstream PR merges.
[patch.crates-io]
tokio-postgres = { path = "../../../../vendor/tokio-postgres" }
mysql_async = { path = "../../../../vendor/mysql-async" }
