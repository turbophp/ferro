[package]
name = "ferrod"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

# NOTE: ferrod REQUIRES panic = "unwind" (the workspace default). The exactly-one-END supervisor
# (later S3 tasks) depends on handler panics unwinding, not aborting the process.
[dependencies]
ferro-proto = { path = "../ferro-proto" }
ferro-pool = { path = "../ferro-pool" }
ferro-classify = { path = "../ferro-classify" }
ferro-manifest = { path = "../ferro-manifest" }
ferro-backend-pg = { path = "../ferro-backend-pg" }
ferro-backend-mysql = { path = "../ferro-backend-mysql" }
ferro-backend-sqlite = { path = "../ferro-backend-sqlite" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "signal", "macros", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
getrandom = "0.2"
nix = { version = "0.29", features = ["socket", "user", "fs", "uio"] }
# SPEC §23 / D20 (M6-F4a): Ferro HTTP, behind the default-on cargo feature `http`.
# `--no-default-features` builds a database-only daemon (§23.13): the HTTP route then answers
# `Unsupported` and `HELLO_ACK` never sets the `HTTP` feature bit.
ferro-http = { path = "../ferro-http", optional = true }

[features]
default = ["http"]
http = ["dep:ferro-http", "ferro-http/engine"]

[dev-dependencies]
# The OTLP e2e (`tests/otlp_it.rs`, M2-C4c-2) parses what a collector received and exported. Already in
# the lock through `tracing-subscriber`'s `json` feature, so this adds no new crate.
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "time", "test-util"] }
# The chaos live suite (M1-S4 Task 4, `tests/chaos_fate_it.rs`) needs a RAW side connection to
# Postgres — independent of ferrod's own pool — to `pg_terminate_backend(pid)` a targeted backend
# and to poll `pg_stat_activity` for proof a statement is genuinely in flight before firing a
# kill/CANCEL. Resolves to the SAME vendored fork `ferro-backend-pg` uses (workspace
# `[patch.crates-io]`), so no second copy of the driver is compiled in.
tokio-postgres = "0.7"
# The MySQL chaos live suite (M1-S6 Task 8, `tests/mysql_chaos_it.rs`) needs a RAW side connection to
# MySQL/MariaDB — independent of ferrod's own pool — to `KILL [QUERY] <id>` a targeted backend, hold
# a row lock (so a chaos write is provably interruptible-with-error, unlike a self-terminating
# `SLEEP()`), and poll `information_schema.processlist` for proof a statement is genuinely in flight
# before firing an external kill/CANCEL. Resolves to the SAME vendored fork `ferro-backend-mysql`
# uses (workspace `[patch.crates-io]`), so no second copy of the driver is compiled in.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
# The SQLite BEGIN lockstep test (C3-3e, `tests/sqlite_begin_lockstep_it.rs`) needs a RAW side
# connection to the same database file — independent of ferrod's own pool — to attempt the competing
# writer lock. Same role the two raw drivers above play for the chaos suites, and it resolves to the
# SAME rusqlite `ferro-backend-sqlite` uses, so no second copy of the driver is compiled in.
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
# The Ferro HTTP decoding suites (M6-F4b, `tests/http_f4b_it.rs`, `tests/http_rss_it.rs`) build gzip
# and deflate response bodies. The SAME `flate2` `ferro-http` decodes with (already in the lock).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The Ferro HTTP TLS suite (M6-F5a, `tests/http_tls_it.rs`): certificates generated IN-TEST
# (`ferro_http::testcert`, the non-default `test-certs` feature — `ring`, already in the lock; `rcgen`
# is not, and D20 does not list it), and local TLS upstreams built on the SAME `rustls`/`tokio-rustls`
# the engine uses, with D20's selections (`default-features = false` keeps `aws-lc-rs` out, §23.13).
ferro-http = { path = "../ferro-http", features = ["test-certs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
