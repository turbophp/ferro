# Branch carried explicitly on the wire (W-3): unknown code still classified by branch.
[branches]
Retryable = 1
Indeterminate = 2
NonRetryable = 3

# Each code is its own [codes.<Name>] table (NOT an inline-table on the header line — that is
# invalid TOML). code = 0xBxxx where B is the branch nibble.
[codes.ConnectionLost]
code = 0x1001
branch = 1
[codes.PoolTimeout]
code = 0x1002
branch = 1
[codes.TxDeadline]
code = 0x1003
branch = 1
[codes.Deadlock]
code = 0x1004
branch = 1
[codes.SerializationFailure]
code = 0x1005
branch = 1
[codes.ReplicaUnavailable]
code = 0x1006
branch = 1
[codes.WriteUnconfirmed]
code = 0x2001
branch = 2
[codes.Syntax]
code = 0x3001
branch = 3
[codes.Unique]
code = 0x3002
branch = 3
[codes.ForeignKey]
code = 0x3003
branch = 3
[codes.NotNull]
code = 0x3004
branch = 3
[codes.Check]
code = 0x3005
branch = 3
[codes.Auth]
code = 0x3006
branch = 3
[codes.QueryTimeout]
code = 0x3007
branch = 3
[codes.Cancelled]
code = 0x3008
branch = 3
[codes.Protocol]
code = 0x3009
branch = 3
[codes.Unsupported]
code = 0x300A
branch = 3
