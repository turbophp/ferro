# Branch carried explicitly on the wire (W-3): unknown code still classified by branch.
[branches]
Retryable = 1
Indeterminate = 2
NonRetryable = 3

# Each code is its own [codes.<Name>] table (NOT an inline-table on the header line — that is
# invalid TOML). code = 0xBxxx where B is the branch nibble.
[codes.ConnectionLost]
code = 0x1001
branch = 1
[codes.PoolTimeout]
code = 0x1002
branch = 1
[codes.TxDeadline]
code = 0x1003
branch = 1
[codes.Deadlock]
code = 0x1004
branch = 1
[codes.SerializationFailure]
code = 0x1005
branch = 1
[codes.ReplicaUnavailable]
code = 0x1006
branch = 1
# Ferro HTTP (SPEC §23.7.1, M6-F2). The upstream cannot be reached or is held off BEFORE any byte of
# the request exists on a connection: DNS, the dial, a TLS transport failure (`tls_handshake`), an
# open breaker, a busy breaker probe, or the HTTP drain. Retryable because nothing was sent; a
# breaker's refusal carries `retry_after_ms`. The `detail` says which (`[http.causes]` below).
[codes.UpstreamUnavailable]
code = 0x1007
branch = 1
# Ferro HTTP (SPEC §23.7.1): refused before sending by a host-level rate limit (`rate_limited`) or
# by an upstream's own Retry-After hold (`retry_after_hold`); always carries `retry_after_ms`.
[codes.RateLimited]
code = 0x1008
branch = 1
[codes.WriteUnconfirmed]
code = 0x2001
branch = 2
[codes.Syntax]
code = 0x3001
branch = 3
[codes.Unique]
code = 0x3002
branch = 3
[codes.ForeignKey]
code = 0x3003
branch = 3
[codes.NotNull]
code = 0x3004
branch = 3
[codes.Check]
code = 0x3005
branch = 3
[codes.Auth]
code = 0x3006
branch = 3
[codes.QueryTimeout]
code = 0x3007
branch = 3
[codes.Cancelled]
code = 0x3008
branch = 3
[codes.Protocol]
code = 0x3009
branch = 3
[codes.Unsupported]
code = 0x300A
branch = 3
# A tx-scoped request naming a `tx_id` the engine has no LIVE entry for: unknown, already committed
# or rolled back, aborted, or another session's (indistinguishable by design — §7). Distinct from
# `Protocol`, which stays reserved for a genuine WIRE fault (a malformed body, an unknown savepoint).
# The split is what lets a client's `rollBack()` swallow "that transaction is already gone" without
# also swallowing its own codec defects — SPEC §22.2.
[codes.TxNotFound]
code = 0x300B
branch = 3
# Refused by the engine's own ACCESS POLICY rather than by the database: an admin verb the peer's
# kernel-attested uid is not authorized for (SPEC D15 — including every OPERATE verb while
# `FERRO_ADMIN_UIDS` is empty, and every admin verb on a connection with no attested uid), or an
# admin destination outside the verb's policy (a backup target that is not a plain file name, or that
# is a symlink). Widened by SPEC §23 (C6, keyed at M6-F2): also every Ferro HTTP policy refusal, made
# BEFORE anything is sent — an unknown upstream or one this uid may not use (indistinguishable by
# design, D15), an origin, target, method, header or body the §23.4 validator refuses, or a resolved
# address outside the upstream's class; the `detail` is the `forbidden_*` token that names which.
# NonRetryable: retrying the same request as the same peer is refused the same way.
# Distinct from `Auth`, which is the BACKEND refusing the pool's own credentials.
[codes.Forbidden]
code = 0x300C
branch = 3
# Ferro HTTP (SPEC §23.7.1, §23.8.8): the upstream's TLS identity or parameters were refused before
# sending — certificate verification (`tls_verify`), protocol version (`tls_version`) or ALPN
# (`tls_alpn`). NonRetryable: the same dial is refused the same way until the operator acts. A TLS
# TRANSPORT failure (`tls_handshake`) is `UpstreamUnavailable` instead.
[codes.TlsRefused]
code = 0x300D
branch = 3
# Ferro HTTP (SPEC §23.7.1): the upstream sent a response head and the exchange then failed, so the
# TRANSPORT fate is known — the request was received and answered. It does NOT mean "nothing
# happened": after a 2xx head the request was applied. For an idempotent request a body-level link
# failure is `ConnectionLost` instead; a decode failure or `max_response_bytes` is this code either
# way.
[codes.ResponseIncomplete]
code = 0x300E
branch = 3

# Ferro Queue (SPEC §24.4, keyed at M7-G1a). A fenced verb's (ACK/RELEASE/EXTEND) token names no
# current reservation, so the verb did NOTHING. Known fate; outside a transaction the Laravel tier
# treats it as done, inside one it must roll back (§24.6, §24.11).
[codes.LeaseLost]
code = 0x300F
branch = 3
# Ferro Queue (SPEC §24.5): a tx-scoped queue verb named a store whose pool is not the transaction's.
# Refused before any statement, so the transaction is untouched.
[codes.PoolMismatch]
code = 0x3010
branch = 3
# Ferro Queue (SPEC §24.3 G1 prerequisite (c), allocated at M7-G1a): a `job_id` or `token` that is
# well-formed on the wire (a `bin` within its bounds) but that the store's KIND cannot decode — for
# the `sql` kind, a `job_id` that is not the canonical decimal text of an `i64`, or a token that is
# not its 8-byte layout. Refused before any statement. Deliberately NOT `Protocol` (the frame is
# well-formed; that code means a wire fault) and NOT `LeaseLost` (which a tier treats as "did
# nothing, done" — it would hide what is always a CLIENT defect: no engine ever minted such bytes).
[codes.InvalidHandle]
code = 0x3011
branch = 3

# The Ferro HTTP CAUSE vocabulary (SPEC §23.5.6, M6-F2). On service `HTTP`, an `ErrorPayload.detail`
# is EXACTLY one of these tokens — never free text and never a PHP-supplied value — because a Guzzle
# handler picks its exception class by cause (§23.11.3) and `message` is not for programmatic
# matching (/proto/PROTOCOL.md §5). `sqlstate` and `errno` are `nil` on HTTP terminals. A closed
# vocabulary, generated into both codecs (charter rule 2), so the engine and the client name a cause
# only through a constant.
#
# Shape: `KEY = "token"`, where the KEY is the constant's name and the VALUE is the wire token. The
# key MUST be the token upper-cased — `Registry::from_toml_dir` and both generators refuse anything
# else — so the table cannot drift into two spellings of one cause. A token is a lowercase ASCII
# letter followed by lowercase ASCII letters, digits and `_`, appears once, and the table is not
# empty (the rule: ferro-proto `src/http_causes_rule.rs`; its PHP copy in `tools/gen-php.php`; both
# held to `tools/http-causes-shape-cases.json`). The table is unordered on the wire; it is grouped here by
# §23.5.6's phase only to make review easier, and a token named in two phases there (`deadline`,
# `timeout`, `cancelled`) is listed once, at its first group.
[http.causes]
# Not sent: policy (`Forbidden`)
FORBIDDEN_UPSTREAM  = "forbidden_upstream"
FORBIDDEN_ORIGIN    = "forbidden_origin"
FORBIDDEN_TARGET    = "forbidden_target"
FORBIDDEN_METHOD    = "forbidden_method"
FORBIDDEN_HEADER    = "forbidden_header"
FORBIDDEN_BODY      = "forbidden_body"
FORBIDDEN_ADDRESS   = "forbidden_address"
# Not sent: admission
BREAKER_OPEN        = "breaker_open"
BREAKER_PROBE_BUSY  = "breaker_probe_busy"
RATE_LIMITED        = "rate_limited"
RETRY_AFTER_HOLD    = "retry_after_hold"
QUEUE_FULL          = "queue_full"
QUEUE_TIMEOUT       = "queue_timeout"
BODY_BUDGET         = "body_budget"
DEADLINE            = "deadline"
DRAINING            = "draining"
# Not sent: dial
DNS                 = "dns"
CONNECT_REFUSED     = "connect_refused"
CONNECT_UNREACHABLE = "connect_unreachable"
CONNECT_TIMEOUT     = "connect_timeout"
TLS_HANDSHAKE       = "tls_handshake"
TLS_VERSION         = "tls_version"
TLS_ALPN            = "tls_alpn"
TLS_VERIFY          = "tls_verify"
# Dispatched, not sent (§22.2 (ct), review F-3); also `deadline` and `cancelled`
UNSENT_WRITE        = "unsent_write"
UNSENT_CLOSED       = "unsent_closed"
# Sent, no head
WRITE               = "write"
RESET               = "reset"
EOF_EMPTY           = "eof_empty"
EOF_PARTIAL_HEAD    = "eof_partial_head"
MALFORMED_HEAD      = "malformed_head"
OVERSIZE_HEAD       = "oversize_head"
INFORMATIONAL_101   = "informational_101"
TIMEOUT             = "timeout"
CANCELLED           = "cancelled"
# HTTP/2: RESERVED. These are post-v1 with slice F5b (SPEC §22.2 (de)), and no v1 path produces them.
# Post-v1 they apply to an effectively-idempotent request only.
H2_REFUSED_STREAM   = "h2_refused_stream"
H2_GOAWAY_ABOVE_LAST = "h2_goaway_above_last"
H2_STREAM_ERROR     = "h2_stream_error"
H2_CONNECTION_ERROR = "h2_connection_error"
# After head; also `timeout` and `cancelled`
BODY_RESET          = "body_reset"
BODY_EOF            = "body_eof"
BODY_FRAMING        = "body_framing"
DECODE              = "decode"
MAX_RESPONSE_BYTES  = "max_response_bytes"
READ_IDLE           = "read_idle"
