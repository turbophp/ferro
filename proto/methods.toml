protocol_version    = 4   # M2-C4c-1: ExecRequest gained a NINTH field (`traceparent`), and both
                          # decoders enforce strict arity (PROTOCOL.md §8), so an unbumped pair would
                          # fail inside ExecRequest::decode on the first EXEC instead of at the first
                          # byte of the first frame. Previously bumped at M2-C2g (3), when PoolInfo
                          # gained a FOURTH element (`literals_are_standard`), and for the same
                          # reason: both decoders reject any other arity, so an unbumped pair would fail deep
                          # inside HelloAck::decode instead of at the FIRST BYTE of the FIRST FRAME
                          # (Header::decode -> BadVersion). The lock file carries no message SHAPES --
                          # only ids, codes and tags -- so nothing else moves on its own and this
                          # number is the only thing that can make the skew loud. Bumped for exactly
                          # the same reason at M1-S8a (2), when HELLO_ACK pools became structured
                          # metadata in the first place.
magic               = 0xF7
max_frame_payload   = 16777216   # 16 MiB hard codec ceiling (W-5)
default_credit_frames = 64
default_credit_bytes  = 16777216  # 16 MiB -- deliberately == MAX_FRAME_PAYLOAD so any single valid DATA frame always fits the per-request credit window (M1-S5 large-row rule, user-confirmed Option B)

[flags]
STREAM     = 0x01
END        = 0x02
CANCEL     = 0x04
OOB_FD     = 0x08
COMPRESSED = 0x10

[services]
CORE   = 1
SQL    = 2
TX     = 3
STREAM = 4
ADMIN  = 5
# RESERVED, comments only (no keys, so no generated constant and no registry-hash change):
#   HTTP  = 6   Ferro HTTP  — SPEC §23 (docs/spec/23-http.md), allocated by §23; the key lands
#                with its first code slice, M6-F2.
#   QUEUE = 7   Ferro Queue — SPEC §24 (docs/spec/24-queue.md), allocated by §24; the key lands
#                with its first code slice, M7-G1.
# Do not reuse 6 or 7 for anything else.

[methods.core]
HELLO         = 1
HELLO_ACK     = 2
PING          = 3
PONG          = 4
GOODBYE       = 5
WINDOW_UPDATE = 6

# SQL service (§6). EXEC is the single request-bearing autocommit statement method (S5).
[methods.sql]
EXEC = 1

# TX service (§6/§7, S6). Transaction lifecycle over a connection pinned to a `tx_id` (NOT the
# client socket). BEGIN mints a tx_id; COMMIT/ROLLBACK end it and release the pinned conn;
# SAVEPOINT/RELEASE/ROLLBACK_TO drive the engine-named savepoint stack. (Service `TX = 3` above.)
[methods.tx]
BEGIN       = 1
COMMIT      = 2
ROLLBACK    = 3
SAVEPOINT   = 4
RELEASE     = 5
ROLLBACK_TO = 6

# STREAM service (§6/§7.2 window credit, M1-S5). The windowed DATA-channel producer for
# `fetch:stream` EXEC: HEAD carries the result's column metadata once, DATA carries a batch of rows;
# each DATA frame sets the `STREAM` flag (`flags::STREAM = 0x01`), and the terminal `END` is the
# unchanged `Outcome::Ok({affected, stats})` (no rows — they already went out as DATA). (Service
# `STREAM = 4` above.)
[methods.stream]
HEAD = 1
DATA = 2

# ADMIN service (M2-C3-7b, SPEC §7.6 + D15). Served only on the engine's Unix socket and gated per
# VERB by the peer's kernel-attested uid in the SESSION layer, before any handler runs: a READ verb
# needs only an admitted peer, an OPERATE verb additionally needs the uid in `FERRO_ADMIN_UIDS`, and
# an empty `FERRO_ADMIN_UIDS` disables every OPERATE verb. Each method's class is fixed in `ferrod`'s
# `admin::AdminVerb` by an exhaustive match, so a new method cannot ship without one.
# BACKUP (OPERATE): a consistent snapshot of a SQLite pool's database via `VACUUM INTO`, written as
# a plain file name inside the pool's D14 allowed directory. (Service `ADMIN = 5` above.)
[methods.admin]
BACKUP = 1

# Terminal outcome-envelope status discriminant (decision W-4). In /proto so both codecs
# generate it rather than hand-writing 0/1/2 (charter rule 2).
[outcome]
OK        = 0
ERROR     = 1
CANCELLED = 2

# Out-of-band payload encodings (M3-D3, SPEC §5.1, PROTOCOL.md §1.1). A frame carrying the `OOB_FD`
# flag has an `OobRef {fd_index, len, encoding}` as its payload, and `encoding` says what the
# passed memfd's `len` bytes ARE. In /proto for the same reason `[outcome]` is: both codecs
# generate it instead of hand-writing the byte (charter rule 2).
# FRAME_PAYLOAD: the memfd holds exactly the bytes the frame would have carried INLINE as its
# payload (for an `END` frame, the whole `Outcome` envelope), so a receiver decodes them exactly as
# it would an inline payload. `COMPRESSED` (D11) would be a second value; none exists.
[oob_encoding]
FRAME_PAYLOAD = 0

[features.engine]
MEMFD          = 0x01
LISTEN_STREAMS = 0x02
MANIFEST       = 0x04

[features.client]
MEMFD_RX = 0x01
FIBERS   = 0x02
